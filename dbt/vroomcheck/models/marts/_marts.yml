version: 2

models:
  - name: fct_complaints
    description: One row per in-scope owner complaint (ODINO). Grain of the early-warning signal.
    columns:
      - name: odino
        tests: [unique, not_null]
      - name: vehicle_key
        tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_vehicle'), field: vehicle_key}}
      - name: received_date
        tests: [not_null]
      - name: narrative
        tests: [not_null]

  - name: bridge_complaint_component
    columns:
      - name: odino
        tests:
          - relationships: {arguments: {to: ref('fct_complaints'), field: odino}}

  - name: fct_recalls
    description: One row per vehicle recall campaign - the ground truth for back-testing.
    columns:
      - name: campno
        tests: [unique, not_null]
      - name: recall_date
        tests: [not_null]

  - name: bridge_recall_vehicle
    columns:
      - name: campno
        tests:
          - relationships: {arguments: {to: ref('fct_recalls'), field: campno}}

  - name: fct_investigations
    columns:
      - name: action_number
        tests: [unique, not_null]
      - name: investigation_type
        tests:
          - accepted_values:
              arguments: {values: ['PE', 'EA', 'DP', 'RQ', 'AQ', 'RP', 'SQ', 'EQ', 'ID', 'TA']}
              config: {severity: warn}

  - name: fct_tsbs
    columns:
      - name: nhtsa_id
        tests: [unique, not_null]

  - name: dim_vehicle
    description: Conformed (make, model, model year) dimension shared by every fact.
    columns:
      - name: vehicle_key
        tests: [unique, not_null]

  - name: dim_component
    columns:
      - name: component_top
        tests: [unique, not_null]
